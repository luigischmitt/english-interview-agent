services:
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.6.0
    ports:
      - "8880:8880"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8880/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  backend:
    build:
      context: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    ports:
      - "3001:3001"
    environment:
      SPEECH_PROVIDER: kokoro
      KOKORO_BASE_URL: http://kokoro:8880
      INTERVIEWER_VOICE: af_bella+af_heart
      ALLOWED_ORIGIN: http://localhost:3000
      TRANSCRIPTION_TIMEOUT_MS: ${TRANSCRIPTION_TIMEOUT_MS:-55000}
      TRANSCRIPTION_STREAM_MAX_DURATION_MS: ${TRANSCRIPTION_STREAM_MAX_DURATION_MS:-180000}
      TRANSCRIPTION_STREAM_MAX_BYTES: ${TRANSCRIPTION_STREAM_MAX_BYTES:-6291456}
      TRANSCRIPTION_STREAM_MAX_ACTIVE_SESSIONS: ${TRANSCRIPTION_STREAM_MAX_ACTIVE_SESSIONS:-8}
      TRANSCRIPTION_STREAM_MAX_CONCURRENT_TRANSCRIPTIONS: ${TRANSCRIPTION_STREAM_MAX_CONCURRENT_TRANSCRIPTIONS:-4}
      TRANSCRIPTION_STREAM_MAX_QUEUED_TRANSCRIPTIONS: ${TRANSCRIPTION_STREAM_MAX_QUEUED_TRANSCRIPTIONS:-4}
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      kokoro:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:3001
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_node_modules:
  frontend_node_modules:
