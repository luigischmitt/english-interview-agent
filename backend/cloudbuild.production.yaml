# Builds the production image and pushes it to Artifact Registry.
# Usage (from the repository root):
#   gcloud builds submit backend --config backend/cloudbuild.production.yaml \
#     --substitutions=_IMAGE=us-east1-docker.pkg.dev/PROJECT/REPO/backend:TAG
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "Dockerfile.production", "-t", "${_IMAGE}", "."]
images:
  - "${_IMAGE}"
substitutions:
  _IMAGE: ""
options:
  logging: CLOUD_LOGGING_ONLY
